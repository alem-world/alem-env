name: Publish to PyPI

# Publishes alem-env to PyPI when a GitHub Release is published. Publishing the
# release is the single act that ships a version: it creates the tag, carries the
# release notes, and triggers this workflow.
# Uses PyPI Trusted Publishing (OIDC) — no API token secret is stored in the repo.
# One-time setup: on https://pypi.org add a trusted publisher for project "alem-env"
# pointing at this repo, workflow "publish.yml", environment "pypi".
#
# Pushing a version tag deliberately does NOT trigger this. Listening for both a
# tag push and a release fires the workflow twice for one version, and since PyPI
# refuses to replace an existing version the second run always fails. That is what
# happened to v0.2.0: the tag published it, and creating the release months later
# tried to upload the same files again.
#
# So: bump the version in pyproject.toml, merge, then draft a release against a new
# tag and publish it. Do not push the tag by hand first.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # Unconditional: the release event always arrives with github.ref set to the
      # release's tag, so there is no case where this check should be skipped. It
      # is the only thing standing between a forgotten version bump and a release
      # whose tag disagrees with what gets uploaded.
      - name: Verify the release tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag  pyproject=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match pyproject version $pkg. Bump the version in pyproject.toml before publishing the release."
            exit 1
          fi

      - name: Check distribution metadata
        run: |
          python -m pip install twine
          twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/alem-env
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
